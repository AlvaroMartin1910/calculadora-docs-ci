name: Genera la documentacion de manera automatica

on:
  workflow_dispatch:
  push:
  
permissions: 
  contents: read
  pages: write
  id-token: write
  
jobs:
  documentacion:
    runs-on: ubuntu-latest
    
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
        
      - name: Instalar python, pdoc y generar la documentacion
        uses: ./.github/actions/generar-docs
        
      - name: Subir la documentacion
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  publicar:
    needs: documentacion
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
